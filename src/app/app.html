<main class="page-container">
  <div class="card">
    <header class="header">
      <h1>GENERADOR DE QR</h1>
      <p class="subtitle">Pega tu enlace y descarga la imagen en segundos</p>
    </header>

    <section class="input-section">
      <div class="input-wrapper">
        <svg class="link-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
        <input id="url-input" type="text" [ngModel]="url()" (ngModelChange)="onUrlChange($event)"
          placeholder="https://ejemplo.com" autocomplete="off" spellcheck="false" />
        @if (url()) {
        <button type="button" class="btn-clear" (click)="clear()" title="Borrar enlace">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
        }
      </div>
    </section>

    @if (errorMessage()) {
    <div class="alert-error">
      {{ errorMessage() }}
    </div>
    }

    <section class="qr-result-section">
      @if (qrDataUrl()) {
      <div class="qr-preview-card">
        <div class="qr-image-wrapper">
          <img [src]="qrDataUrl()" alt="Código QR generado" class="qr-image" />
        </div>

        <button type="button" class="btn-download" (click)="downloadQr()">
          DESCARGAR QR
        </button>
      </div>
      } @else {
      <div class="empty-placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M3 9h18" />
          <path d="M9 21V9" />
        </svg>
        <p>Escribe o pega un enlace arriba para generar el QR</p>
      </div>
      }
    </section>
  </div>
</main>
